<template>
  <style>
    :host {
      display: block;
      width: 200px;
      padding: 10px;
      border: 1px solid #151515;
      background: linear-gradient(#727272, #4d4d4d);
      border-radius: 6px;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.35);
    }
    .head { font-size: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .ports { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .knob { display: flex; justify-content: center; }
  </style>
  <div class="head"><strong>2-Out</strong><span>InOut</span></div>
  <div class="ports">
    <g2-input color="red" port="left" title="Left input"></g2-input>
    <g2-input color="red" port="right" title="Right input"></g2-input>
  </div>
  <div class="knob">
    <g2-knob id="volume" value="0.75" min="0" max="1">Vol</g2-knob>
  </div>
</template>
<script type="module">
  const template = document.createElement('template');
  template.innerHTML = globalThis.__g2CurrentTemplate;

  class G2TwoOut extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      this.shadowRoot.appendChild(template.content.cloneNode(true));
      this.leftIn = null;
      this.rightIn = null;
      this.volume = null;
      this.output = null;
    }

    connectedCallback() {
      this.shadowRoot.getElementById('volume').addEventListener('g2-change', (event) => {
        if (this.volume) this.volume.gain.value = event.detail.value;
      });
    }

    bindAudioContext(context) {
      if (this.output) return;
      this.leftIn = context.createGain();
      this.rightIn = context.createGain();
      const merger = context.createChannelMerger(2);
      this.volume = context.createGain();
      this.leftIn.connect(merger, 0, 0);
      this.rightIn.connect(merger, 0, 1);
      merger.connect(this.volume).connect(context.destination);
      this.volume.gain.value = Number(this.shadowRoot.getElementById('volume').getAttribute('value') || 0.75);
      this.output = merger;
    }

    getInputNode(port) {
      return port === 'right' ? this.rightIn : this.leftIn;
    }

    getOutputNode() {
      return this.output;
    }
  }

  if (!customElements.get('g2-two-out')) customElements.define('g2-two-out', G2TwoOut);
</script>
